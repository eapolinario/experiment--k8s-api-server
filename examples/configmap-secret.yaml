# Smoke fixture: exercise ConfigMap envFrom + secret env.valueFrom +
# configMap volume projection. The container prints the resolved values
# and `cat`s the projected file so `kubectl logs` makes the projection
# observable.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-cfg
  namespace: default
data:
  GREETING: hello
  TARGET: world
  app.conf: |
    mode=test
    feature=on
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
  namespace: default
type: Opaque
stringData:
  TOKEN: s3cret
---
apiVersion: v1
kind: Pod
metadata:
  name: cfg-consumer
  namespace: default
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "ENV=${GREETING}-${TARGET} TOKEN=${TOKEN}"
          echo "FILE_CONTENTS:"
          cat /etc/cfg/app.conf
          # keep the container alive long enough for kubectl logs to scrape.
          sleep 30
      envFrom:
        - configMapRef:
            name: demo-cfg
      env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: demo-secret
              key: TOKEN
      volumeMounts:
        - name: cfg-vol
          mountPath: /etc/cfg
          readOnly: true
  volumes:
    - name: cfg-vol
      configMap:
        name: demo-cfg
